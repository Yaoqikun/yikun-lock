name: Build macOS

on:
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时自动构建
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build_mac.sh'
      - '.github/workflows/build-macos.yml'

jobs:
  build-macos:
    runs-on: macos-latest  # macOS runner (auto-updates)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 cryptography pyinstaller

      - name: Convert icon to icns
        run: |
          if [ -f "src/icon.png" ]; then
            ICONSET="src/icon.iconset"
            mkdir -p "$ICONSET"
            sips -z 16 16     src/icon.png --out "$ICONSET/icon_16x16.png"     2>/dev/null || true
            sips -z 32 32     src/icon.png --out "$ICONSET/icon_16x16@2x.png"  2>/dev/null || true
            sips -z 32 32     src/icon.png --out "$ICONSET/icon_32x32.png"     2>/dev/null || true
            sips -z 64 64     src/icon.png --out "$ICONSET/icon_32x32@2x.png"  2>/dev/null || true
            sips -z 128 128   src/icon.png --out "$ICONSET/icon_128x128.png"   2>/dev/null || true
            sips -z 256 256   src/icon.png --out "$ICONSET/icon_128x128@2x.png" 2>/dev/null || true
            sips -z 256 256   src/icon.png --out "$ICONSET/icon_256x256.png"   2>/dev/null || true
            sips -z 512 512   src/icon.png --out "$ICONSET/icon_256x256@2x.png" 2>/dev/null || true
            sips -z 512 512   src/icon.png --out "$ICONSET/icon_512x512.png"   2>/dev/null || true
            sips -z 1024 1024 src/icon.png --out "$ICONSET/icon_512x512@2x.png" 2>/dev/null || true
            iconutil -c icns "$ICONSET" -o src/icon.icns 2>/dev/null || true
            rm -rf "$ICONSET"
            echo "ICON_ICNS=src/icon.icns" >> $GITHUB_ENV
          else
            echo "ICON_ICNS=" >> $GITHUB_ENV
          fi

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "峄坤加密锁" \
            --windowed \
            --onedir \
            --noconfirm \
            --add-data "src/icon.png:." \
            --hidden-import PyQt6 \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import cryptography \
            --hidden-import cryptography.hazmat.primitives.ciphers.aead \
            --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 \
            --hidden-import cryptography.hazmat.primitives.hashes \
            --hidden-import platform_utils \
            --hidden-import lock_core \
            --hidden-import ui \
            ${ICON_ICNS:+--icon "$ICON_ICNS"} \
            src/main.py

      - name: Create app bundle
        run: |
          # 创建 .app 目录结构
          APP_NAME="峄坤加密锁"
          APP_DIR="dist/$APP_NAME.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          
          # 复制 PyInstaller 输出
          cp -r "dist/$APP_NAME/"* "$APP_DIR/Contents/MacOS/" 2>/dev/null || true
          
          # 如果有 icns 图标，复制到 Resources
          if [ -f "src/icon.icns" ]; then
            cp src/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          fi
          
          # 创建 Info.plist
          cat > "$APP_DIR/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>峄坤加密锁</string>
              <key>CFBundleDisplayName</key>
              <string>峄坤加密锁</string>
              <key>CFBundleIdentifier</key>
              <string>com.yikun.lock</string>
              <key>CFBundleVersion</key>
              <string>2.4</string>
              <key>CFBundleShortVersionString</key>
              <string>2.4</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>峄坤加密锁</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>YikunLock Encrypted File</string>
                      <key>CFBundleTypeRole</key>
                      <string>Viewer</string>
                      <key>CFBundleTypeExtensions</key>
                      <array>
                          <string>yklock</string>
                      </array>
                  </dict>
              </array>
          </dict>
          </plist>
          PLIST
          
          echo "App bundle created: $APP_DIR"

      - name: Create DMG (optional)
        run: |
          APP_NAME="峄坤加密锁"
          DMG_NAME="峄坤加密锁-macOS"
          
          # 创建临时目录制作 DMG
          DMG_DIR="/tmp/dmg_content"
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"
          
          # 复制 .app
          cp -r "dist/$APP_NAME.app" "$DMG_DIR/"
          
          # 创建 Applications 快捷方式
          ln -s /Applications "$DMG_DIR/Applications"
          
          # 创建 DMG
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "dist/$DMG_NAME.dmg"
          
          echo "DMG created: dist/$DMG_NAME.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yikun-lock-macos
          path: |
            dist/峄坤加密锁-macOS.dmg
            dist/峄坤加密锁.app
          retention-days: 30
